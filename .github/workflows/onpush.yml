name: check each push

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: npm install, test and lint
      run: |
        npm ci
        npm run build --workspace=packages/svgcanvas
        npm run lint
        npm run test
      env:
        CI: true

