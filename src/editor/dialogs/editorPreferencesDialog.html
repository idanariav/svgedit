<style>
    :not(:defined) {
        display: none;
    }

    /* Colours, buttons and fields come from dialogSkin.css.js (token-driven). */
    #svg_prefs_container {
        width: 340px;
        max-width: calc(100vw - 32px);
        z-index: 20001;
    }

    #svginfo_editor_prefs {
        margin: 0 0 14px;
        font-size: 15px;
        font-weight: 600;
    }

    .pref-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 0 0 12px;
    }

    .pref-row > span { flex: 1 1 auto; }
    .pref-row > select { flex: 0 0 150px; }
    .pref-row > input[type="number"] { flex: 0 0 64px; }

    #tool_prefs_back {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
    }
</style>
<dialog id="svg_prefs" aria-label="Editor Preferences">
    <div id="svg_prefs_container">
        <h2 id="svginfo_editor_prefs"></h2>
        <label class="pref-row">
            <span id="svginfo_rulers_onoff"></span>
            <input id="show_rulers" type="checkbox" value="show_rulers" checked="checked" />
        </label>
        <label class="pref-row">
            <span id="svginfo_unit"></span>
            <select id="base_unit">
                <option value="px">Pixels</option>
                <option value="cm">Centimeters</option>
                <option value="mm">Millimeters</option>
                <option value="in">Inches</option>
                <option value="pt">Points</option>
                <option value="pc">Picas</option>
                <option value="em">Ems</option>
                <option value="ex">Exs</option>
            </select>
        </label>
        <label class="pref-row">
            <span id="svginfo_scrub"></span>
            <input id="scrub_fields" type="checkbox" checked="checked" />
        </label>
        <label class="pref-row">
            <span id="svginfo_select_same"></span>
            <input id="select_same_tolerance" type="number" min="0" max="100" step="1" value="0" />
        </label>
        <label class="pref-row">
            <span id="svginfo_pencil_stabilization"></span>
            <input id="pencil_stabilization" type="number" min="0" max="95" step="5" value="30" />
        </label>
        <label class="pref-row">
            <span id="svginfo_pencil_fidelity"></span>
            <input id="pencil_fidelity" type="number" min="0.5" max="10" step="0.5" value="2" />
        </label>
        <label class="pref-row">
            <span id="svginfo_theme"></span>
            <select id="theme_select">
                <option value="light">Light</option>
                <option value="dark">Dark</option>
            </select>
        </label>
        <div id="tool_prefs_back" class="toolbar_button">
            <button id="tool_prefs_cancel"></button>
            <button id="tool_prefs_save" class="dlg-primary"></button>
        </div>
    </div>
</dialog>
