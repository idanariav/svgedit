<style>
    /* Colours, buttons and fields come from dialogSkin.css.js (token-driven). */
    #dialog_container {
        text-align: center;
        max-width: 400px;
        width: max-content;
        min-width: 280px;
    }

    #dialog_content p,
    #dialog_content select,
    #dialog_content label {
        margin: 10px;
    }

    #dialog_buttons {
        display: flex;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
    }

    .se-select {
        text-align: center;
    }
</style>
<dialog id="export_box" aria-label="export svg">
    <div class="overlay"></div>
    <div id="dialog_container">
        <div id="dialog_content">
            <p id="export_region_label">Region</p>
            <se-select id="se-export-region" label=""></se-select>
            <p id="export_select"></p>
            <se-select id="se-storage-pref" label="" options="PNG,JPEG,BMP,WEBP" values="PNG::JPEG::BMP::WEBP"></se-select>
            <se-spin-input id="se-quality" label="ui.quality" size="3" min="0" max="100" value="100" step="5" />
            <label id="se-include-bg-label" style="display:flex;align-items:center;gap:6px;margin:10px;">
              <input type="checkbox" id="se-include-bg" />
              <span id="export_include_bg_label">Include background color</span>
            </label>
        </div>
        <div id="dialog_buttons">
            <button id="export_ok" class="dlg-primary"></button>
            <button id="export_cancel"></button>
        </div>
    </div>
</dialog>
