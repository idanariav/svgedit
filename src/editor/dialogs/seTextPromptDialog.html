<style>
    :not(:defined) {
        display: none;
    }

    /* Design tokens come from svgedit.css, which lists this element in its
       light/dark token blocks (the dialog is mounted outside .svg_editor).
       The host only needs the `theme-dark` class (see seTextPromptDialog.js). */

    #text_prompt_container {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        width: 340px;
        max-width: 92vw;
        background: var(--chrome-bg, #FFFFFF);
        color: var(--fg, #1B1F24);
        border: 1px solid var(--chrome-border, #E6E8EC);
        border-radius: 14px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.22);
        overflow: hidden;
    }

    #text_prompt_header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--chrome-border, #E6E8EC);
    }

    #text_prompt_title {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
    }

    #text_prompt_close {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--muted, #6B7280);
        font-size: 18px;
        line-height: 1;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background .12s, color .12s;
    }

    #text_prompt_close:hover {
        background: var(--icon-hover-bg, #F1F3F5);
        color: var(--fg, #1B1F24);
    }

    #text_prompt_body {
        padding: 16px;
    }

    #text_prompt_message {
        display: block;
        margin: 0 0 8px 2px;
        font-size: 13px;
        color: var(--muted, #6B7280);
    }

    #text_prompt_input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px 10px;
        font-size: 13px;
        color: var(--fg, #1B1F24);
        background: var(--field-bg, #FFFFFF);
        border: 1px solid var(--field-border, #DDE1E7);
        border-radius: 8px;
        transition: border-color .12s, box-shadow .12s;
    }

    #text_prompt_input:focus {
        outline: none;
        border-color: var(--accent, #2962FF);
        box-shadow: 0 0 0 3px var(--accent-ring, rgba(41, 98, 255, 0.16));
    }

    #text_prompt_footer {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        padding: 14px 16px;
        border-top: 1px solid var(--chrome-border, #E6E8EC);
    }

    #text_prompt_footer button {
        appearance: none;
        font-size: 13px;
        font-weight: 500;
        padding: 7px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: background .12s, border-color .12s, opacity .12s;
    }

    #text_prompt_cancel {
        border: 1px solid var(--field-border, #DDE1E7);
        background: var(--field-bg, #FFFFFF);
        color: var(--fg, #1B1F24);
    }

    #text_prompt_cancel:hover {
        border-color: var(--field-border-h, #C8CDD6);
    }

    #text_prompt_ok {
        border: 1px solid var(--accent, #2962FF);
        background: var(--accent, #2962FF);
        color: #FFFFFF;
    }

    #text_prompt_ok:disabled {
        opacity: 0.45;
        cursor: default;
    }

    /* Amber accent in dark theme needs dark text for contrast. */
    :host(.theme-dark) #text_prompt_ok {
        color: #1B1F24;
    }

    #text_prompt_box::backdrop {
        background: rgba(0, 0, 0, 0.2);
    }
</style>
<dialog id="text_prompt_box" aria-label="prompt">
    <div id="text_prompt_container">
        <div id="text_prompt_header">
            <p id="text_prompt_title">Enter a value</p>
            <button id="text_prompt_close" type="button" aria-label="Close">&#x2715;</button>
        </div>
        <div id="text_prompt_body">
            <label id="text_prompt_message" for="text_prompt_input"></label>
            <input type="text" id="text_prompt_input" />
        </div>
        <div id="text_prompt_footer">
            <button id="text_prompt_cancel" type="button">Cancel</button>
            <button id="text_prompt_ok" type="button">OK</button>
        </div>
    </div>
</dialog>
