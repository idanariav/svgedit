<style>
    :not(:defined) {
        display: none;
    }

    /* Colours, buttons and fields come from dialogSkin.css.js (token-driven). */
    #svg_source_editor #svg_source_container {
        text-align: center;
        z-index: 6;
    }

    #save_output_btns {
        display: none;
        text-align: left;
    }

    #save_output_btns p {
        margin: .5em 1.5em;
        display: inline-block;
    }

    #svg_source_editor form {
        width: 100%;
        margin: 0;
    }

    #svg_source_editor #svg_source_textarea {
        padding: 8px;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 12px;
        min-height: 200px;
        width: 100%;
        height: 95%;
    }

    #svg_source_editor #tool_source_back {
        display: flex;
        justify-content: flex-start;
        gap: 8px;
        margin-bottom: 10px;
    }

    #tool_source_dynamic {
        cursor: pointer;
    }

    .tool_label {
        cursor: pointer;
        margin: 8px 0 0;
        display: inline-block;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
    }
</style>
<dialog id="svg_source_editor" aria-label="SVG Source Editor">
    <div id="svg_source_container">
        <div id="tool_source_back" class="toolbar_button">
            <button id="tool_source_save" class="dlg-primary"></button>
            <button id="tool_source_cancel"></button>
        </div>
        <div id="save_output_btns">
            <p id="copy_save_note"></p>
            <button id="copy_save_done"></button>
        </div>
        <form>
            <textarea id="svg_source_textarea" spellcheck="false" rows="5" cols="80"></textarea>
        </form>
        <label class="tool_label" for="tool_source_dynamic">
          <input type="checkbox" id="tool_source_dynamic" checked>Toggle dynamic size
        </label>
    </div>
</dialog>
