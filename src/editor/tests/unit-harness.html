<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SVG-Edit Unit Harness</title>
  <script type="importmap">
  {
    "imports": {
      "paper/dist/paper-core.js": "./vendor/paper/paper-core-stub.js"
    }
  }
  </script>
  <script type="module">
    import './vendor/path-seg-shim/path-seg-shim.js'
    import * as namespaces from './vendor/svgcanvas/core/namespaces.js'
    import * as domUtils from './vendor/svgcanvas/core/dom-utils.js'
    import * as bboxUtils from './vendor/svgcanvas/core/bbox-utils.js'
    import * as pathUtils from './vendor/svgcanvas/core/path-utils.js'
    import * as encodingUtils from './vendor/svgcanvas/core/encoding-utils.js'
    import * as paperUtils from './vendor/svgcanvas/core/paper-utils.js'
    import * as math from './vendor/svgcanvas/core/math.js'
    import * as pathModule from './vendor/svgcanvas/core/path.js'
    import * as coords from './vendor/svgcanvas/core/coords.js'
    import * as units from './vendor/svgcanvas/core/units.js'
    import * as draw from './vendor/svgcanvas/core/draw.js'
    import * as history from './vendor/svgcanvas/core/history.js'
    import * as recalculate from './vendor/svgcanvas/core/recalculate.js'
    import * as util from './vendor/svgcanvas/common/util.js'
    import * as touch from './vendor/svgcanvas/core/touch.js'
    import * as clearModule from './vendor/svgcanvas/core/clear.js'

    // core/utilities.js was split into dom/bbox/path/encoding/paper-utils
    // (commit 2328a466); merge them back into one `utilities` namespace so
    // existing specs (which call utilities.init(canvas) and expect the
    // combined surface) keep working unchanged.
    const utilities = {
      ...domUtils,
      ...bboxUtils,
      ...pathUtils,
      ...encodingUtils,
      ...paperUtils,
      init (canvas) {
        domUtils.init(canvas)
        bboxUtils.init(canvas)
        // domUtils/bboxUtils no longer export their canvas-state-dependent
        // helpers as bare functions (module-singleton-hazard fix) — init()
        // now attaches them directly onto the given canvas instead. Copy
        // those back onto the merged `utilities` namespace so existing specs
        // that call e.g. utilities.findDefs()/getElement() bare keep working.
        const perInstance = [
          'getElement', 'findDefs', 'getRefElem', 'getReferencedDefElements',
          'snapToGrid', 'snapPointToGrid', 'getVisibleElements',
          'getStrokedBBoxDefaultVisible', 'getStrokedBBox'
        ]
        perInstance.forEach((name) => {
          if (canvas[name]) utilities[name] = canvas[name]
        })
      }
    }

    // Expose modules for Playwright specs.
    window.svgHarness = {
      namespaces,
      utilities,
      math,
      pathModule,
      coords,
      units,
      draw,
      history,
      recalculate,
      util,
      touch,
      clearModule
    }
  </script>
</head>
<body>
  <div id="root"></div>
</body>
</html>
